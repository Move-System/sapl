; Laco da materializacao do PDF-alvo da assinatura (ADR 0014).
;
; Sem este programa rodando, materia protocolada NUNCA vira pendencia de
; assinatura no app — so por clique manual no painel, em silencio. O SAPL de
; producao roda fora de docker, entao o laco nao sobe sozinho com o servico:
; e o supervisor (o mesmo que mantem o gunicorn) quem garante boot + restart.
;
; Instalacao (uma vez):
;   sudo cp scripts/supervisor-materializacao.conf /etc/supervisor/conf.d/sapl-materializacao.conf
;   ->  ajustar command/directory/user espelhando o [program:sapl] ja existente
;       em /etc/supervisor/conf.d/ (mesmo venv, mesmo diretorio, mesmo usuario)
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status sapl-materializacao
;
; Acompanhamento: o painel /sistema/integracao/materializacao/ — fila de
; prioridade crescendo sem esvaziar = este programa caiu.

[program:sapl-materializacao]
; AJUSTAR os tres caminhos abaixo para o layout da VPS (copiar do [program:sapl])
command=/var/interlegis/.virtualenvs/sapl/bin/python manage.py materializar_pdfs_para_assinatura --intervalo 300 --tick 15
directory=/var/interlegis/sapl
user=sapl

autostart=true
autorestart=true
startsecs=10
; O SIGTERM derruba o laco no meio de uma passada sem drama: a linha aberta em
; PassadaMaterializacao fica orfa e a propria rotina a fecha e destrava o lock
; na subida seguinte (_fechar_orfas).
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/sapl-materializacao.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
