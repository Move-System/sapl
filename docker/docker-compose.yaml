services:
  sapldb:
    image: postgres:10.5-alpine
    restart: always
    container_name: postgres
    labels:
        NAME: "postgres"
    environment:
      POSTGRES_PASSWORD: sapl
      POSTGRES_USER: sapl
      POSTGRES_DB: sapl
      PGDATA: /var/lib/postgresql/data/
      TZ: UTC
      PG_TZ: UTC
    volumes:
      - sapldb_data:/var/lib/postgresql/data/
    ports:
      - "5433:5432"
    networks:
      - sapl-net
  saplsolr:
    image: solr:8.11
    restart: always
    command: bin/solr start -c -f
    container_name: solr
    labels:
        NAME: "solr"
    volumes:
      - solr_data:/var/solr
      - solr_configsets:/opt/solr/server/solr/configsets
    ports:
      - "8983:8983"
    networks:
      - sapl-net
  sapl:
#    image: interlegis/sapl:3.1.164-RC5
    build:
      context: ../
      dockerfile: ./docker/Dockerfile
    container_name: sapl
    labels:
       NAME: "sapl"
    restart: always
    environment:
      ADMIN_PASSWORD: interlegis
      ADMIN_EMAIL: email@dominio.net
      DEBUG: 'False'
      DATABASE_URL: postgresql://bruno:Sapl%402025@legisinc.com.br:5432/sapl
      EMAIL_PORT: 587
      EMAIL_USE_TLS: 'False'
      EMAIL_HOST: smtp.dominio.net
      EMAIL_HOST_USER: usuariosmtp
      EMAIL_SEND_USER: usuariosmtp
      EMAIL_HOST_PASSWORD: senhasmtp
      USE_SOLR: 'True'
      SOLR_COLLECTION: sapl
      SOLR_URL: http://solr:solr@saplsolr:8983
      IS_ZK_EMBEDDED: 'True'
      ENABLE_SAPN: 'False'
      TZ: America/Sao_Paulo
      ONLYOFFICE_URL: 'http://onlyoffice:80'
      ONLYOFFICE_JWT_ENABLED: 'False'
    volumes:
      - sapl_data:/var/interlegis/sapl/data
      - sapl_media:/var/interlegis/sapl/media
    depends_on:
      - saplsolr
      - onlyoffice
    ports:
      - "8000:80"
    networks:
      - sapl-net
  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: onlyoffice-documentserver
    labels:
       NAME: "onlyoffice"
    restart: always
    environment:
      - JWT_ENABLED=false
      - JWT_SECRET=your-secret-key-change-this
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_log:/var/log/onlyoffice
      - onlyoffice_fonts:/usr/share/fonts/truetype/custom
    ports:
      - "8002:80"
    networks:
      - sapl-net
networks:
  sapl-net:
    name: sapl-net
    driver: bridge
volumes:
  sapldb_data:
  sapl_data:
  sapl_media:
  solr_data:
  solr_configsets:
  onlyoffice_data:
  onlyoffice_log:
  onlyoffice_fonts:
